version: '3.8'

services:
  # Backend FastMCP Server
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fastmcp-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Supabase configuration (override with your own values)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Tavily API for web search (optional)
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # llama.cpp configuration
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-http://host.docker.internal:8001}
    volumes:
      - ./storage:/app/storage
      - ./server:/app/server
    # Note: Make sure llama.cpp server is running on the LLAMACPP_BASE_URL configured above
    networks:
      - fastmcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsSI", "http://backend:8000/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Bridge Server (MCP Client - connects Frontend to Backend)
  bridge:
    build:
      context: .
      dockerfile: bridge.Dockerfile
    container_name: fastmcp-bridge
    ports:
      - "3001:3001"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Supabase configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # MCP Server connection (FastMCP server)
      - MCP_SERVER_HOST=backend
      - MCP_SERVER_PORT=8000
    volumes:
      - ./client:/app/client
      - ./storage:/app/storage
    depends_on:
      - backend
    networks:
      - fastmcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://bridge:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js Application
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: fastmcp-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Next.js API routes call the bridge server (server-side)
      - BRIDGE_SERVER_URL=http://bridge:3001
    depends_on:
      - backend
      - bridge
    networks:
      - fastmcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # llama.cpp LLM Server (run separately on your machine or server)
  # Start llama.cpp server with:
  # llama-server.exe --model "path/to/model.gguf" --port 8001 --n-gpu-layers 20
  # Or use Docker: docker run -p 8001:8001 ghcr.io/ggerganov/llama.cpp:server --model model.gguf --port 8001
  
networks:
  fastmcp-network:
    driver: bridge

volumes:
  # Note: Storage volume removed - using Supabase for file storage
  # If you need local storage, create a volume here

